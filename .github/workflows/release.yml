name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  audit:
    name: Audit Rust dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit Rust dependency licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
          manifest-path: src-tauri/Cargo.toml

  release:
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version and user-facing notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }
          & ./.agents/skills/release/scripts/check-release-version.ps1 -ExpectedVersion $version
          npm run release-notes:check -- --version $version

      - name: Generate and audit third-party license notices
        run: npm run licenses

      - name: Frontend checks
        run: |
          npm run format:check
          npm run check
          npm run test
          npm run build

      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build installer and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Eroge Playtime Tracker ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: ErogePlaytimeTracker_[version]_[arch][setup].[ext]
